# AIX DV Common - 组件 Catalog V0.1
# Skill Suite 只从 Catalog 中选择达到 qualified 且兼容目标 tool profile 的组件。
# 每条目遵循 schemas/component.schema.yaml。

catalog_version: 0.1

components:

  # ---- L0 Types & Contracts ----
  - name: dv_common_types
    vlnv: aix:dv:common_types:1.0.0
    category: types
    owner: dv-arch
    maturity: candidate
    capabilities:
      reset_aware: false
      drainable: false
      produces_metric: false
      affects_pass_fail: false
    compatibility:
      uvm_profiles: [uvm12_legacy, uvm1800_2]
      simulators: [vcs, xcelium, questa]
    quality:
      lint: not_run
      unit_test: not_run
      negative_test: not_run
      portability: not_run

  - name: dv_component_contract
    vlnv: aix:dv:common_types:1.0.0
