# AIX DV Common - Test Result Schema V0.1
# 对应 plan.md 第 11.1 节示例。
$schema: "http://json-schema.org/draft-07/schema#"
title: "dv-test-result"
type: object
required: [schema_version, test, run]
additionalProperties: true
properties:
  schema_version:
    type: string
    enum: ["1.0"]
  test:
    type: object
    required: [name]
    properties:
      name:
        type: string
      requirement_ids:
        type: array
        items: { type: string }
      category:
        type: string
  run:
    type: object
    required: [id, seed, status, exit_code]
    properties:
      id:
        type: string
        description: run-YYYYMMDD-NNNNN
      seed:
        type: integer
      status:
        type: string
        enum: [PASS, FAIL, SKIP, ABORT]
      exit_code:
        type: integer
        enum: [0, 1, 2, 3, 4, 5, 6, 7, 8]
      start_time:
        type: string
        format: date-time
      duration_s:
        type: number
        minimum: 0
  failure:
    type: object
    properties:
      count:
        type: integer
        minimum: 0
      primary_signature:
        type: [string, "null"]
      list:
        type: array
        items: { $ref: "failure.schema.yaml" }
  metrics:
    type: object
    description: 结构化 metric（key -> number/string）
    additionalProperties:
      type: [integer, number, string, "null"]
  artifacts:
    type: object
    properties:
      log:      { type: [string, "null"] }
      wave:     { type: [string, "null"] }
      coverage: { type: [string, "null"] }
